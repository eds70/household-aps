[pytest]
asyncio_mode = auto
testpaths = tests

# ==========================================
# Подавление warnings из библиотек
# ==========================================
# Эти warnings — не из нашего кода, а из starlette/fastapi TestClient.
# Когда httpx2 и новый starlette станут стабильными — обновим зависимости
# и уберём filterwarnings.
#
# StarletteDeprecationWarning: Using httpx with starlette.testclient is deprecated
# DeprecationWarning: The anyio.abc.BlockingPortal alias is deprecated
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*