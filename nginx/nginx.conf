# nginx/nginx.conf
#
# ВНЕШНИЙ reverse-proxy APS Production Scheduler.
#
# Слушает :80 (и :443 после настройки HTTPS).
# Маршрутизирует:
#   /api/*, /docs, /redoc, /openapi.json, /health → backend:8000
#   /                                             → frontend:80
#
# Роль:
#   - единая точка входа из интернета;
#   - TLS-терминация (после certbot);
#   - прокси-заголовки (X-Real-IP, X-Forwarded-For, X-Forwarded-Proto)
#     — backend видит реальный IP клиента, а не адрес Docker-сети.
#
# ⚠️  НЕ путать с frontend/nginx.conf (внутренний nginx контейнера aps_frontend).
#     Тот отдаёт SPA-статику. Этот — маршрутизирует запросы.

worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ==========================================
    # ОСНОВНЫЕ НАСТРОЙКИ
    # ==========================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Скрыть версию nginx.
    server_tokens off;

    # Логи.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ==========================================
    # ПРОИЗВОДИТЕЛЬНОСТЬ
    # ==========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Максимальный размер загружаемого файла (импорт материалов из Excel).
    client_max_body_size 20M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ==========================================
    # GZIP (общий для всех location)
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/ld+json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==========================================
    # UPSTREAM — внутренние сервисы Docker
    # ==========================================
    # Имена сервисов из docker-compose.prod.yml.
    # Nginx резолвит их через встроенный DNS Docker.
    upstream aps_backend {
        server backend:8000;
        keepalive 32;
    }

    upstream aps_frontend {
        server frontend:80;
        keepalive 32;
    }

    # ==========================================
    # СБРОС ТАЙМАУТОВ ДЛЯ WEBSOCKET/SSE (на будущее)
    # ==========================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==========================================
    # SERVER 1: HTTP (:80)
    # ==========================================
    # Работает сейчас: единая точка входа без шифрования.
    # После настройки HTTPS — этот блок превратится в редирект
    # (см. закомментированный блок ниже).
    server {
        listen 80 default_server;
        server_name _;

        # ==========================================
        # API → backend
        # ==========================================
        location /api/ {
            proxy_pass http://aps_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            # WebSocket-ready (для будущего SSE/WebSocket).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Таймауты для solver: до 15 минут (build-plan может считаться долго).
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # ==========================================
        # Swagger / ReDoc / OpenAPI
        # ==========================================
        location /docs {
            proxy_pass http://aps_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass http://aps_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://aps_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # Health-check
        # ==========================================
        location = /health {
            proxy_pass http://aps_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # ==========================================
        # Всё остальное → frontend (SPA-статика)
        # ==========================================
        # Внутренний nginx контейнера aps_frontend
        # отдаёт index.html, /assets/* и т.д.
        location / {
            proxy_pass http://aps_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # СКРЫТИЕ СЛУЖЕБНЫХ ПУТЕЙ
        # ==========================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ==========================================
    # SERVER 2: HTTPS (:443) — ЗАГОТОВКА
    # ==========================================
    # Раскомментируйте после получения сертификатов через certbot.
    # Сертификаты монтируются из ./nginx/certs/ (см. docker-compose.prod.yml).
    #
    # Также ПОСЛЕ включения HTTPS:
    #   1. В SERVER 1 (выше) замените содержимое на редирект:
    #         return 301 https://$host$request_uri;
    #   2. В .env обновите:
    #         ALLOWED_ORIGINS=https://your-domain.com
    #         VITE_API_URL=https://your-domain.com
    #   3. Пересоберите frontend:
    #         docker compose -f docker-compose.prod.yml build frontend
    #
    # server {
    #     listen 443 ssl http2 default_server;
    #     server_name your-domain.com;
    #
    #     # ==========================================
    #     # SSL
    #     # ==========================================
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     # HSTS (закомментировано — включайте после проверки, что HTTPS работает везде).
    #     # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ==========================================
    #     # API → backend
    #     # ==========================================
    #     location /api/ {
    #         proxy_pass http://aps_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection $connection_upgrade;
    #         proxy_read_timeout 900s;
    #         proxy_send_timeout 900s;
    #     }
    #
    #     location /docs       { proxy_pass http://aps_backend; proxy_set_header Host $host; }
    #     location /redoc      { proxy_pass http://aps_backend; proxy_set_header Host $host; }
    #     location /openapi.json { proxy_pass http://aps_backend; proxy_set_header Host $host; }
    #     location = /health   { proxy_pass http://aps_backend; access_log off; }
    #
    #     # ==========================================
    #     # Всё остальное → frontend
    #     # ==========================================
    #     location / {
    #         proxy_pass http://aps_frontend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location ~ /\. {
    #         deny all;
    #         access_log off;
    #     }
    # }
}