# frontend/nginx.conf
#
# ВНУТРЕННИЙ конфиг nginx для отдачи SPA-статики.
# Работает внутри контейнера aps_frontend, слушает :80.
#
# Роль:
#   - отдаёт собранную статику из /usr/share/nginx/html;
#   - делает fallback на index.html для SPA-роутов
#     (/audit, /help/:slug, /whatif, ...);
#   - кэширует /assets/* (Vite-хэшированные файлы) — 1 год;
#   - не кэширует index.html — чтобы при деплое браузер сразу увидел новую версию.
#
# ⚠️  НЕ путать с nginx/nginx.conf (внешний reverse-proxy в корне проекта).
#     Тот слушает :80/:443 на хосте, проксирует /api/* на backend,
#     а / на frontend. Этот — только статика.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # БЕЗОПАСНОСТЬ
    # ==========================================
    # Скрыть версию nginx из Server header.
    server_tokens off;

    # Запретить доступ к dotfiles (.git, .env и т.п.).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Запретить доступ к backup-файлам.
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================
    # GZIP
    # ==========================================
    # Уменьшает трафик JS/CSS в 3–5 раз.
    # Не сжимаем изображения (уже сжаты) и видео.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/json
        application/ld+json
        image/svg+xml
        font/woff
        font/woff2;

    # ==========================================
    # КЭШИРОВАНИЕ
    # ==========================================

    # Vite собирает JS/CSS в /assets/ с хэшем в имени файла
    # (например, /assets/index-abc123.js). Такие файлы можно
    # кэшировать «навсегда» — при изменении кода хэш изменится,
    # и браузер скачает новый файл.
    #
    # try_files $uri =404: если файла нет — отдаём чистый 404.
    # НЕ fallback на index.html — иначе браузер попытается
    # распарсить HTML как JS и упадёт с "Unexpected token <".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        try_files $uri =404;
    }

    # Иконки, шрифты, изображения из корня.
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ==========================================
    # SPA-FALLBACK
    # ==========================================
    # index.html НЕ кэшируем — чтобы при деплое пользователь
    # сразу получил новую версию (и новые хэши /assets/).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Всё остальное — SPA-fallback.
    # /audit       → index.html (роутер отрисует страницу)
    # /help/xxx    → index.html
    # /nonexistent → index.html (роутер покажет 404-компонент или редирект)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # ЛОГИ
    # ==========================================
    # Логи в stdout/stderr — Docker сам их подхватит.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}