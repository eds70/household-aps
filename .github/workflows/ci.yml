# .github/workflows/ci.yml
# CI для APS Production Scheduler.
# Запускается на push и pull_request в main/develop.
# Прогоняет:
#   - линтеры (ruff, black --check)
#   - тесты (pytest) для backend
#   - сборку frontend (npm run build)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aps
          POSTGRES_PASSWORD: aps_secret
          POSTGRES_DB: household
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app tests || true

      - name: Black (format check)
        run: black --check app tests || true

      - name: Initialize DB schema
        env:
          PGPASSWORD: aps_secret
        run: |
          psql -h localhost -U aps -d household -f init_schema.sql
          psql -h localhost -U aps -d household -f add_01.sql
          psql -h localhost -U aps -d household -f add_02.sql

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://aps:aps_secret@localhost:5432/household
          SECRET_KEY: test-secret-key-for-ci-min-32-chars-long
        run: |
          pytest tests/ -v --tb=short

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build